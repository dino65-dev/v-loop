[project]
name = "vloop"
version = "0.1.0"
description = "Verified Adaptive Loop Agent: deterministic V0"
requires-python = ">=3.11"

[project.optional-dependencies]
model = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
